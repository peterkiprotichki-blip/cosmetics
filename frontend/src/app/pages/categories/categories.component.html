<div class="space-y-6">
  <app-page-header
    title="Categories"
    subtitle="Group products into categories such as Skincare or Makeup."
    icon="tag"
  >
    <button type="button" class="btn btn-primary btn-md" (click)="openCreate()">
      <app-icon name="plus" [size]="16" />
      Add category
    </button>
  </app-page-header>

  <app-alert [message]="errorMessage()" />

  @if (showForm()) {
    <div class="card p-5">
      <div class="mb-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <span class="text-pink-600">
            <app-icon [name]="editingId ? 'edit' : 'plus'" [size]="18" />
          </span>
          <h2 class="text-base font-semibold text-slate-800">
            {{ editingId ? 'Edit category' : 'Add category' }}
          </h2>
        </div>
        <button type="button" class="btn btn-outline btn-sm" (click)="closeForm()">
          Cancel
        </button>
      </div>

      <app-alert [message]="formError()" />

      <form (ngSubmit)="save()" class="flex flex-col gap-4 sm:flex-row sm:items-end">
        <div class="flex-1">
          <label for="categoryName" class="field-label">Category name</label>
          <input
            id="categoryName"
            name="categoryName"
            type="text"
            [(ngModel)]="categoryName"
            required
            class="input w-full"
          />
        </div>
        <button
          type="submit"
          [disabled]="saving()"
          class="btn btn-primary btn-md"
        >
          @if (saving()) {
            Saving...
          } @else {
            {{ editingId ? 'Save changes' : 'Add category' }}
          }
        </button>
      </form>
    </div>
  }

  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="table-head">
          <tr>
            <th class="table-th">Category</th>
            <th class="table-th text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @if (loading()) {
            <tr>
              <td colspan="2">
                <div class="flex flex-col items-center gap-2 px-5 py-12 text-center">
                  <span class="h-5 w-5 animate-spin rounded-full border-2 border-pink-600 border-t-transparent"></span>
                  <p class="text-sm font-medium text-slate-500">Loading...</p>
                </div>
              </td>
            </tr>
          } @else {
            @for (category of categories(); track category._id) {
              <tr class="table-row">
                <td class="table-td font-medium text-slate-800">
                  {{ category.categoryName }}
                </td>
                <td class="table-td text-right">
                  <div class="flex items-center justify-end gap-2">
                    <button
                      type="button"
                      class="btn btn-outline btn-xs"
                      (click)="openEdit(category)"
                    >
                      <app-icon name="edit" [size]="14" />
                      Edit
                    </button>
                    <button
                      type="button"
                      class="btn btn-danger btn-xs"
                      (click)="removeCategory(category)"
                    >
                      <app-icon name="trash" [size]="14" />
                      Delete
                    </button>
                  </div>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="2">
                  <div class="flex flex-col items-center gap-2 px-5 py-12 text-center">
                    <span class="text-slate-300">
                      <app-icon name="tag" [size]="32" />
                    </span>
                    <p class="text-sm font-medium text-slate-500">
                      No categories found.
                    </p>
                    <button
                      type="button"
                      class="btn btn-primary btn-sm mt-2"
                      (click)="openCreate()"
                    >
                      <app-icon name="plus" [size]="14" />
                      Add your first category
                    </button>
                  </div>
                </td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
