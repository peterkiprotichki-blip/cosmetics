<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-pink-100 via-slate-100 to-slate-200 p-4">
  <div class="card w-full max-w-md p-8 shadow-xl">
    <div class="mb-6 flex flex-col items-center text-center">
      <app-brand-mark [size]="56" />
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-800">
        Victory Cosmetics
      </h1>
      <p class="mt-1 text-sm text-slate-500">Sign in to the inventory system</p>
    </div>

    <app-alert [message]="errorMessage()" />

    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" class="space-y-4">
      <div>
        <label for="username" class="field-label">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          [(ngModel)]="username"
          required
          class="input w-full"
          placeholder="Enter username"
        />
      </div>

      <div>
        <label for="password" class="field-label">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
          class="input w-full"
          placeholder="Enter password"
        />
      </div>

      <button
        type="submit"
        [disabled]="submitting() || loginForm.invalid"
        class="btn btn-primary btn-md w-full"
      >
        @if (submitting()) {
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
