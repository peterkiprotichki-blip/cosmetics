<div class="card mx-auto flex max-w-lg flex-col items-center p-10 text-center">
  <span
    class="flex h-14 w-14 items-center justify-center rounded-full border border-red-100 bg-red-50 text-red-600"
  >
    <app-icon name="ban" [size]="26" />
  </span>
  <h1 class="mt-4 text-xl font-semibold text-slate-800">Access denied</h1>
  <p class="mt-2 text-sm text-slate-600">
    Access denied. You do not have permission to view this page.
  </p>
  <a routerLink="/" class="btn btn-primary btn-md mt-6">
    <app-icon name="chevron-left" [size]="16" />
    Back to dashboard
  </a>
</div>
