<div class="print-expand flex h-screen overflow-hidden bg-slate-100 text-slate-800">
  @if (drawerOpen()) {
    <div
      class="no-print fixed inset-0 z-30 bg-slate-900/50 lg:hidden"
      (click)="closeDrawer()"
    ></div>
  }

  <aside
    class="no-print fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-slate-200 bg-white shadow-xl transition-transform duration-200 lg:static lg:z-auto lg:translate-x-0 lg:shadow-none"
    [class.-translate-x-full]="!drawerOpen()"
    [class.translate-x-0]="drawerOpen()"
  >
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
      <div>
        <p class="text-lg font-bold tracking-tight text-pink-600">Victory Cosmetics</p>
        <p class="text-xs text-slate-500">Inventory Management</p>
      </div>
      <button
        type="button"
        class="rounded-md p-1 text-slate-500 hover:bg-slate-100 hover:text-slate-700 lg:hidden"
        (click)="closeDrawer()"
        aria-label="Close menu"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4">
      @for (item of visibleNavigation; track item.path) {
        <a
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          routerLinkActive="bg-pink-50 text-pink-700 border-pink-600"
          class="flex items-center rounded-lg border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          (click)="closeDrawer()"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-slate-200 px-5 py-4 text-xs text-slate-500">
      Signed in as {{ auth.role() }}
    </div>
  </aside>

  <div class="print-expand flex min-w-0 flex-1 flex-col">
    <header
      class="no-print flex items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 shadow-sm lg:px-8"
    >
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="rounded-md p-2 text-slate-600 hover:bg-slate-100 lg:hidden"
          (click)="drawerOpen.set(true)"
          aria-label="Open menu"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <span class="text-sm font-semibold text-slate-800 lg:hidden">Victory Cosmetics</span>
        <span class="hidden text-sm font-semibold text-slate-700 lg:block">
          Victory Cosmetics — Inventory
        </span>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium text-slate-800">{{ auth.userName() }}</p>
          <p class="text-xs text-slate-500">{{ auth.role() }}</p>
        </div>
        <span
          class="hidden rounded-full bg-pink-100 px-2.5 py-1 text-xs font-semibold text-pink-700 sm:inline-block"
        >
          {{ auth.role() }}
        </span>
        <button
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 hover:text-slate-900"
          (click)="auth.logout()"
        >
          Logout
        </button>
      </div>
    </header>

    <main class="print-full flex-1 overflow-y-auto p-4 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
